services:
  - type: web
    name: incoin-auto
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INCOIN_BASE_URL
        value: "https://api.incoinpay.net"
      - key: VITE_INCOIN_BASE_URL
        value: "https://api.incoinpay.net"
      - key: VITE_ENABLE_DEVTOOL
        value: "true"
